<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Pessoa</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="js/cadastro.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>Editar Pessoa</h1>
        <form id="formEditar">
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" required maxlenght="100">
       
            <label for="idade">Idade</label>
            <input type="number" id="idade" required max="130">
            
            <div class="acoes">
                <button type="submit">Cadastrar</button>
                <a href="index.html" class="botao secundario">Cancelar</a>
            </div>
        </form>
        <p id="mensage" role="status"></p>
    </main>

</body>
</html>
